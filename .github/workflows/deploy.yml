name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 手动触发，方便改了文案先发一次再验证
  workflow_dispatch:

# 只需要最小权限：Pages 部署需要写权限和 OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支连续推送时只跑最后一次，避免每次改字都排一次队
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 固定 24.04，避免 ubuntu-latest 在2026-10迁移到 Ubuntu 26 带来的意外
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Pages 官方三件套：配置 -> 打包产物 -> 发布
      # 版本说明：v4/v5 系列的action 仍以 Node 20 为目标，会被强制跑在
      # Node 24 上并触发弃用警告，故统一升到当前主版本。
      - uses: actions/configure-pages@v6
        id: pages
        # 首次部署时仓库可能还没有 Pages 站点记录，读取会404。
        # enablement 让这一步降级为警告并尝试自行创建站点，
        # 避免「站点等部署、部署等站点」的死锁。
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # 排除不该进产物的东西：.git、CI 配置、本地临时文件
          # 注意：.nojekyll 必须保留，否则 Jekyll 会接管这个静态站
          exclude: |
            .git
            .github
            node_modules
            *.zip

      - id: deployment
        uses: actions/deploy-pages@v5